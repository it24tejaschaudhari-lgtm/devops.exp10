server.port=${SERVER_PORT:8080}
spring.application.name=taskbox-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/taskbox_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
logging.level.com.taskbox=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN
